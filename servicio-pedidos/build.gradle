description = 'Servicio de gestion de pedidos - TiendaOnline'

dependencies {
    //dependencia para hacer solitudes http entre microservicios
    implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    runtimeOnly 'org.postgresql:postgresql'

    // Observabilidad
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'       // traceId / spanId en cada log
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'   // logs en formato JSON
    implementation 'com.github.loki4j:loki-logback-appender:1.5.2'       // envío de logs a Grafana Loki
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'           // métricas en /actuator/prometheus

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mock-server:mockserver-netty:5.15.0'
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}
