server:
  port: 8083

spring:
  application:
    name: servicio-pedidos
  datasource:
    url: jdbc:postgresql://localhost:5432/pedidos_db
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
pedidos:
  expiracion:
    cron: "0 0 2 * * *"
    #Para probar con 30 segundos el cron de expiración de pedidos
    #cron: "0/30 * * * * *"
servicios:
  clientes:
    url: http://localhost:8081/
  inventario:
    url: http://localhost:8082/


management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,prometheus